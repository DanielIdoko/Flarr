version: '3.8'

services:
  backend:
    build: .
    container_name: mern_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # Add Clerk environment variables here, e.g.:
      # - CLERK_API_KEY=${CLERK_API_KEY}
      # - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo:6
    container_name: mern_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: